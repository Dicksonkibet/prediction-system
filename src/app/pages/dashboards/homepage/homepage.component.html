<div class="min-vh-100 d-flex flex-column bg-light">
    <!-- Header Section -->
    <header class="bg-white shadow-sm py-4 border-bottom text-center">
      <div class="container">
        <h1 class="fw-bold text-primary display-5" role="heading" aria-level="1">
          Credit Risk Prediction System
        </h1>
        <p class="lead text-secondary">
          Machine Learning-powered risk assessment for smarter lending
        </p>
      </div>
    </header>
 
  
    <!-- Main Content -->
    <main class="container flex-grow-1 d-flex align-items-center py-5">
      <div class="row align-items-center g-5 w-100">
        
        <!-- Features Section -->
        <div class="col-lg-7">
          <div class="row g-4">
            <div *ngFor="let feature of features; let i = index" class="col-md-6">
              <div class="card feature-card h-100 border-0 shadow-sm rounded-4"
                   [class.hovered]="feature.hovered"
                   (mouseenter)="toggleHover(i, true)"
                   (mouseleave)="toggleHover(i, false)"
                   [attr.aria-label]="feature.title + ' feature card'">
                <div class="card-body p-4">
                  <div class="d-flex align-items-center mb-3">
                    <i class="bi bi-{{feature.icon}} text-primary fs-4 me-3" 
                       aria-hidden="true"></i>
                    <h3 class="h5 mb-0">{{feature.title}}</h3>
                  </div>
                  <p class="card-text text-muted mb-0">{{feature.description}}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
  
        <!-- Authentication Section -->
        <div class="col-lg-5">
          <section aria-labelledby="auth-section">
            <div class="card auth-card border-0 shadow-lg rounded-4 text-center">
              <div class="card-body p-5">
                <h2 id="auth-section" class="h3 fw-bold mb-4 text-primary">
                  Get Started Today
                </h2>
                <p class="text-muted mb-4">
                  Sign in to access credit scoring and risk prediction tools.
                </p>
                <div class="d-grid gap-3">
                  <a routerLink="/login" 
                     class="btn btn-primary btn-lg rounded-pill"
                     role="button">
                    <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>
                    Login
                  </a>
                  <a routerLink="/register" 
                     class="btn btn-success btn-lg rounded-pill"
                     role="button">
                    <i class="bi bi-person-plus me-2" aria-hidden="true"></i>
                    Register
                  </a>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  
    <!-- Footer -->
    <footer class="bg-white text-dark text-center py-4 border-top shadow-sm">
      <div class="container">
        <p class="mb-0 fw-bold">&copy; {{2025}} Credit Risk Prediction System</p>
      </div>
    </footer>
  </div>
